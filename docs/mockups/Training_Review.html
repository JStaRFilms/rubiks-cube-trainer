<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font:14px/1.45 var(--ui)}body.focus{--canvas:#292b30;--chrome:#202227;--raised:#35383f;--text:#f6f3eb;--muted:#c2c0b9;--line:#51545c;--control:#8e929c;--accent:#b6c9e6;--num:"Segoe UI",system-ui,sans-serif}button,select,input,textarea{font:inherit;color:inherit}button,select{min-height:44px;cursor:pointer}button{border:1px solid transparent;border-radius:5px;background:transparent;padding:8px 12px}button:hover{background:var(--raised);border-color:var(--control)}select,input,textarea{background:var(--chrome);border:1px solid var(--control);border-radius:5px;padding:8px;max-width:100%}select{padding-right:24px}button:disabled{opacity:.7;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}button.primary{background:var(--accent);color:var(--chrome);font-weight:600}button.outline{border-color:var(--control)}button.danger,.error{color:var(--error)}.muted{color:var(--muted)}.warning{color:var(--warning)}.accent{color:var(--accent)}a{color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}h1,h2,h3,p{margin:0}h2{font-size:22px;font-weight:600}h3{font-size:16px;font-weight:600}svg.icon{width:20px;height:20px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.tool{display:flex;align-items:center;gap:8px}.toolbar{height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--chrome);border-bottom:1px solid var(--line)}.brand{font-size:14px;font-weight:600;white-space:nowrap}.toolbar select{min-width:120px;background:transparent;border-color:transparent;font-weight:600}.toolbar select:hover{border-color:var(--control)}.summary{font-size:13px;color:var(--muted);white-space:nowrap}.summary button{padding:4px 8px;color:var(--muted)}.toolbar .spacer{flex:1}.health{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}.health:before{content:"";width:5px;height:5px;background:var(--accent);border-radius:50%}.mobile-session{display:none}.workspace{height:calc(100dvh - 56px - 56px);min-height:420px;display:grid;grid-template-columns:248px minmax(0,1fr)}.stage{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr)}.rail{text-align:center;border-bottom:1px solid var(--line);padding:16px 32px 20px;background:var(--canvas)}.railmeta{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:13px;margin-bottom:10px}.scramble{font:23px/1.6 Consolas,Menlo,ui-monospace,monospace;color:var(--text);letter-spacing:.015em;max-width:1400px;margin:auto}.scramble span{display:inline-block;white-space:nowrap;margin:0 5px}.canvas{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:28px 32px 40px;gap:20px}.timer{width:min(100%,1000px);padding:16px 8px 24px;cursor:default;display:flex;align-items:center;flex-direction:column;background:transparent;border:1px solid transparent;min-height:240px;border-radius:12px}.timer:hover{background:transparent;border-color:transparent}.timer:focus-visible{outline:2px solid var(--focus);outline-offset:4px}.timer.armed{border-color:var(--accent)}.phase{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}.digits{font:400 clamp(120px,15vw,224px)/1.18 var(--num);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.035em;white-space:nowrap;color:var(--text)}.digits.long{font-size:clamp(84px,10vw,160px);letter-spacing:-.045em}.instruction{font-size:16px;color:var(--muted);margin-top:12px}.keyhint{font-size:13px;color:var(--muted);text-align:center}.keycap{display:inline-block;padding:1px 6px;border:1px solid var(--control);border-radius:4px;margin-right:5px;font-size:12px}.canvas-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.canvas-actions:empty{display:none}.resultline{display:flex;gap:12px 24px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:14px}.resultline:empty{display:none}.sample-case{display:flex;align-items:center;gap:12px;position:absolute;right:28px;bottom:20px;color:var(--muted);font-size:13px}.sample-case svg{width:42px;height:42px}.dockpanel{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:20px 16px 8px}.sessionhead{display:flex;align-items:center;gap:8px;margin-bottom:16px}.sessionhead select{width:100%;font-size:14px}.sessionhead button{padding:8px}.comparison{font-size:13px;color:var(--muted);margin-bottom:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-bottom:20px}.stat label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}.stat strong{font:400 22px/1.2 Consolas,monospace;font-variant-numeric:tabular-nums}.statsnote{font-size:13px;color:var(--muted);margin-top:-8px;margin-bottom:16px}.loghead,.logrow{display:grid;grid-template-columns:30px 1fr 58px;gap:8px;align-items:center;padding:0 4px}.loghead{color:var(--muted);font-size:12px;border-top:1px solid var(--line);height:32px}.loghead span:last-child,.logrow span:last-child{text-align:right}.log{overflow:auto;min-height:0;flex:1}.logrow{width:100%;border-radius:0;min-height:44px;border-bottom:1px solid var(--line);font:14px Consolas,monospace;text-align:left}.logrow span:first-child{font:12px var(--ui);color:var(--muted)}.logrow span:last-child{color:var(--muted);font-size:12px}.logrow:first-child{color:var(--accent)}.dockbottom{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:4px;margin-top:8px;font-size:13px}.focus .workspace{display:flex;flex-direction:column;min-height:420px}.focus .stage{flex:1;min-height:0}.focus .dockpanel{display:none}.focus .rail{padding:18px 40px 22px}.focus .scramble{font-size:25px}.focus .timer{width:min(100%,1100px);min-height:250px}.focus .digits{font:300 clamp(120px,17vw,260px)/1.12 var(--num);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.055em}.focus .digits.long{font-size:clamp(90px,12vw,180px)}.focus .canvas{padding-bottom:28px;gap:12px}.shelf{display:none}.focus .shelf{display:flex;gap:28px;align-items:center;min-height:126px;padding:16px 32px;background:var(--chrome);border-top:1px solid var(--line)}.shelf-title{width:180px;flex-shrink:0}.history-scope{font-size:12px;color:var(--muted);max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.shelf-title button{padding-left:0;font-weight:600}.shelf-title p{font-size:13px;color:var(--muted)}.shelfstats{display:flex;gap:28px;padding-right:32px;border-right:1px solid var(--line);flex-shrink:0}.shelfstats .stat strong{font:400 23px var(--ui);font-variant-numeric:tabular-nums}.recentstrip{display:flex;min-width:0;flex:1;gap:10px;overflow:hidden}.recentstrip button{font-variant-numeric:tabular-nums;font-size:18px;min-width:70px;text-align:center;padding:8px 6px}.recentstrip small{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.prototype{position:fixed;bottom:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--chrome);border-top:1px solid var(--line);z-index:5;padding:4px 12px max(4px,env(safe-area-inset-bottom));font-size:12px}.prototype .cue{color:var(--muted);margin-right:12px}.prototype button{padding:6px 10px;min-width:44px}.mobile-direction{display:none}.prototype .direction{min-width:106px;text-align:center;font-weight:600}.prototype select{font-size:12px;width:146px;min-height:36px}.backdrop{position:fixed;inset:0;background:#0008;z-index:9}.drawer{position:fixed;inset:0 0 0 auto;width:min(440px,100%);background:var(--raised);border-left:1px solid var(--control);z-index:10;padding:24px;overflow:auto}.drawer header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px}.drawer p{margin:12px 0;line-height:1.6}.drawer section{margin:24px 0;border-top:1px solid var(--line);padding-top:16px}.drawer label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.drawer .field{margin:16px 0}.drawer select,.drawer textarea{width:100%}.drawer textarea{min-height:96px}.drawer dl{display:grid;grid-template-columns:1fr auto;gap:12px;font-variant-numeric:tabular-nums}.drawer dt{color:var(--muted)}.drawer dd{margin:0}.drawer .actions{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.drawer .player{min-height:180px;text-align:center;background:var(--chrome);padding:12px;border-radius:5px}.drawer .player svg{width:160px;height:130px}.drawer .small{font-size:13px;color:var(--muted)}.drawer .log{max-height:300px}.drawer .stats{margin-top:20px}.drawer .checkrow{display:flex;gap:12px;align-items:center;min-height:44px;font-size:16px;color:var(--text)}input[type=checkbox]{accent-color:var(--accent);width:20px;height:20px}
@media(min-width:1600px){.canvas{padding-bottom:64px}.rail{padding-top:24px;padding-bottom:24px}}
@media(max-width:1100px) and (min-width:901px){.health{display:none}.toolbar{gap:8px}.focus .shelf{gap:16px;padding:16px 24px}.shelfstats{gap:16px;padding-right:16px}.shelf-title{width:140px}.recentstrip button{min-width:64px}}
@media(max-width:900px){.toolbar{height:96px;padding:4px 12px;display:grid;grid-template-columns:auto minmax(90px,1fr) auto auto auto;gap:0 4px}.toolbar .brand{font-size:13px}.toolbar select{padding:8px 4px;min-width:0;width:100%;font-size:14px}.toolbar .spacer,.toolbar .health,.toolbar .tool span{display:none}.toolbar .tool{padding:8px 10px;min-width:44px;justify-content:center}.toolbar .summary{grid-row:2;grid-column:1/5;font-size:13px;overflow:hidden}.summary button{padding-left:0;max-width:100%;font-size:13px;text-align:left;white-space:nowrap}.mobile-session{display:block;min-width:44px;grid-row:2;grid-column:5;padding:8px 10px}.workspace,.focus .workspace{height:calc(100dvh - 96px - 56px);min-height:0;display:flex;flex-direction:column}.dockpanel{display:none}.stage{flex:1;min-height:0}.rail,.focus .rail{padding:10px 12px 12px}.railmeta{font-size:12px;margin-bottom:8px;gap:4px 12px}.scramble,.focus .scramble{font-size:18px;line-height:1.65;max-width:650px;letter-spacing:0}.scramble span{margin:0 3px}.canvas,.focus .canvas{padding:12px 12px 20px;gap:10px}.timer,.focus .timer{min-height:200px;padding:12px 0 16px;width:min(100%,600px)}.digits{font-size:clamp(92px,28.5vw,160px)}.digits.long{font-size:clamp(62px,20vw,110px)}.focus .digits{font-size:clamp(100px,31vw,174px)}.focus .digits.long{font-size:clamp(72px,23vw,128px)}.instruction{font-size:14px;margin-top:12px}.phase{font-size:12px}.keyhint{font-size:12px}.sample-case{position:static;align-self:center;margin-top:4px}.sample-case svg{width:32px;height:32px}.focus .shelf{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:42px 20px;min-height:86px;height:86px;padding:8px 16px 6px;gap:0 12px}.history-scope{grid-column:1/-1;grid-row:2;max-width:none;width:100%;font-size:10px}.shelf-title{grid-column:1;grid-row:1;width:auto;min-width:0;display:flex;align-items:center;gap:8px}.shelf-title button{min-height:32px;font-size:13px;padding-left:0;white-space:nowrap}.shelf-title p{font-size:11px;white-space:nowrap}.shelfstats{grid-column:2;grid-row:1;padding:0;border:0;gap:0}.shelfstats .stat:not(:first-child),.recentstrip{display:none}.shelfstats .stat label{font-size:12px}.shelfstats .stat strong{font-size:20px}.prototype{gap:4px;padding-left:8px;padding-right:8px}.prototype .cue{margin:0;font-size:11px}.prototype .direction{min-width:80px;font-size:12px}.prototype select{width:112px;min-height:44px;padding-left:6px}.prototype button{padding:6px;min-width:44px}.resultline{font-size:12px;gap:4px 12px}.canvas-actions button{min-height:44px}.drawer{padding:16px}}
@media(max-width:450px){.prototype .cue,.full-direction{display:none}.mobile-direction{display:block}.mobile-direction small{display:block;font-size:10px;font-weight:400;color:var(--muted)}}
@media(max-width:370px){.prototype .cue{display:none}.toolbar .brand{font-size:12px}.timer,.focus .timer{min-height:160px}.canvas,.focus .canvas{gap:6px;padding-bottom:12px}.sample-case{display:none}.keyhint{max-width:270px}.focus .shelf{padding:6px 12px 4px;gap:0 8px;grid-template-rows:42px 18px}.history-scope{max-width:none;font-size:9px}.summary button{font-size:12px}}
@media(max-height:650px){.canvas,.focus .canvas{gap:4px;padding-top:4px;padding-bottom:8px}.timer,.focus .timer{min-height:160px;padding:4px 0 8px}.instruction{margin-top:4px}.sample-case{display:none}.keyhint{font-size:12px}}

<body>
<!-- Two full-viewport static UI proposals. URL state only. No timer, solver, storage or network. -->
<div id="product"></div>
<div class="prototype" aria-label="Prototype direction and state">
<span class="cue">Prototype · sample data</span>
<button type="button" id="prev" aria-label="Previous direction">←</button><span class="direction" id="direction"></span><button type="button" id="next" aria-label="Next direction">→</button>
<label class="sr" for="state">Preview state</label><select id="state"><option value="ready">Untimed</option><option value="tap">First tap</option><option value="inspect">Inspection</option><option value="armed">Armed</option><option value="plus2">15 s · +2</option><option value="dnf">17 s · DNF</option><option value="running">Running</option><option value="result">Saved</option><option value="long">Long time</option><option value="savefailed">Save failed</option><option value="interrupted">Interrupted</option></select>
</div>
<div id="overlay"></div>
<noscript><p>This static preview needs JavaScript to choose a workspace. See Training_Screens.md for the layout specification.</p></noscript>
<script>
'use strict';
const params=new URLSearchParams(location.search);
const stateKeys=[...document.querySelector('#state').options].map(o=>o.value);
let variant=params.get('variant')==='focus'?'focus':'dock';
let trainer=['cross','cross1','oll'].includes(params.get('trainer'))?params.get('trainer'):'cross';
let state=stateKeys.includes(params.get('state'))?params.get('state'):'ready';
let opener=null;
const icons={settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--chrome)"/><circle cx="15" cy="17" r="3" fill="var(--chrome)"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4M12 17h.01"/>',session:'<path d="M8 5h13M8 12h13M8 19h13M3 5h.01M3 12h.01M3 19h.01"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>'};
const icon=name=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
const button=(label,drawer,kind='')=>`<button type="button" class="${kind}" data-drawer="${drawer}">${label}</button>`;
const isStopped=()=>['result','long','savefailed','interrupted'].includes(state);
const title=()=>trainer==='cross'?'Cross':trainer==='cross1'?'Cross+1':'OLL recognition';
const config=()=>trainer==='cross'?'White · max 5 HTM · '+(['ready','long'].includes(state)?'untimed':'15 s inspection'):trainer==='cross1'?'White · K ≤ 5 · cap pending · any pair':'Selected pool · recognition · shuffled';
const times=['4.38','4.91','4.22','6.63 +2','DNF','4.57','5.16','4.04','4.62','4.44','5.10','4.86'];
function stat(label,value){return `<div class="stat"><label>${label}</label><strong>${value}</strong></div>`;}
function historyScope(){return trainer==='cross'?'White · K ≤ 5 · actual depth 4 · 15 s inspection':trainer==='cross1'?'White · K ≤ 5 · actual depth 4 · any pair · illustrative L ≤ 11 · 15 s inspection':'Pool: Sample set · recognition · shuffled · white down / green front · 15 s inspection';}
function compactHistoryScope(){return trainer==='cross'?'History · White · K≤5 · depth 4 · 15 s':trainer==='cross1'?'History · White · K≤5 · depth 4 · Any · L≤11 · 15 s':'History · Sample set · recognition · shuffled · white/green · 15 s';}
function log(){return `<div class="loghead"><span>#</span><span>Execution</span><span>Prep*</span></div><div class="log">${times.map((t,i)=>`<button type="button" class="logrow" data-drawer="attempt" aria-label="Attempt ${24-i}, ${t}, open details"><span>${24-i}</span><span>${t}</span><span>${[38.6,31.2,42.8,39.1,45.3,29.8][i%6]}s</span></button>`).join('')}</div>`;}
function sessionDock(){return `<aside class="dockpanel" aria-label="Compatible session results"><div class="sessionhead"><label class="sr" for="session-select">Session</label><select id="session-select"><option>Evening practice</option></select>${button('+','session','outline')}</div><p class="comparison">History sample · ${historyScope()}<br>24 attempts · 22 successful · 2 DNF</p><div class="stats">${stat('Best','4.04')}${stat('Mean · successful','4.76')}${stat('ao5','4.64')}${stat('ao12','DNF')}</div><p class="statsnote">Compatible sample results</p>${log()}<div class="dockbottom">${button('Preparation*','preparation')}${button('Details','session')}</div><p class="muted" style="font-size:12px;padding:4px">* Includes scrambling</p></aside>`;}
function shelf(){return `<section class="shelf" aria-label="Session shelf"><div class="shelf-title">${button('Evening practice ↗','session')}<p>24 attempts · 2 DNF</p></div><div class="history-scope" title="History sample eligibility: ${historyScope()}. This is not the current challenge configuration." aria-label="History sample eligibility, ${historyScope()}. Not current challenge configuration.">${compactHistoryScope()}</div><div class="shelfstats">${stat('ao5','4.64')}${stat('Best','4.04')}${stat('Mean · 22 successful','4.76')}</div><div class="recentstrip" aria-label="Recent sample attempts">${times.slice(0,8).map((t,i)=>button(`<small>${24-i}</small>${t}`,'attempt')).join('')}</div></section>`;}
function cube(){return `<svg viewBox="0 0 180 150" role="img" aria-label="Schematic cube, not a verified case"><g stroke="var(--canvas)" stroke-width="3"><path fill="#b9c9d5" d="M90 8 160 44 90 80 20 44Z"/><path fill="#879caa" d="M20 44 90 80 90 143 20 107Z"/><path fill="#607d93" d="M90 80 160 44 160 107 90 143Z"/><path fill="none" d="M43 32 114 68M67 20 137 56M43 56 113 20M67 68 137 32M43 56V119M67 68V131M20 65 90 101M20 86 90 122M113 68V131M137 56V119M90 101 160 65M90 122 160 86"/></g></svg>`;}
function timerFrame(){
 const f={ready:['Preparation','0.00','Scramble, then hold to arm'],tap:['Ready for inspection','0.00','First tap starts inspection only'],inspect:['Inspection · 8 s elapsed','7.00','Hold, then release to start'],armed:['Armed · inspection continues','7.00','Release to start'],plus2:['Inspection · 15,000 ms elapsed','+2','Release now adds +2'],dnf:['Inspection · 17,000 ms elapsed','DNF','Release now records DNF'],running:['Execution','4.38','Tap timer or press Space to stop'],result:['Saved on this device','4.382','Attempt complete'],long:['Saved on this device','12:34.567','Long-time width specimen'],savefailed:['Not saved','4.382','Keep this tab open'],interrupted:['Interrupted · excluded','2.100','Raw duration retained, not a successful time']}[state];
 let actions='';
 if(state==='result'||state==='long')actions=button('Review','review','outline')+button(trainer==='oll'?'Confirm base':'Next attempt','next','primary');
 if(state==='savefailed')actions=button('Retry save','unsaved','outline')+button('Export unsaved record','unsaved');
 if(state==='interrupted')actions=button('Fresh attempt','next','outline');
 return `<div class="canvas"><button type="button" class="timer ${state==='armed'?'armed':''}" id="timer" aria-label="Static timer preview. ${f[0]}. ${f[2]}. No live timing."><span class="phase ${state==='plus2'?'warning':state==='dnf'||state==='savefailed'?'error':''}">${f[0]}</span><span class="digits ${state==='long'?'long':''}">${f[1]}</span><span class="instruction">${f[2]}</span></button><div class="resultline">${state==='result'?'Raw 4.382 s · no penalty<span>Preparation* 38.6 s · inspection 12.4 s</span>':state==='long'?'Raw 12:34.567 · preparation* 52.1 s · inspection not used':''}</div><div class="canvas-actions">${actions}</div><p class="keyhint">${isStopped()?'* Preparation includes scrambling':state==='ready'?'<span class="keycap">Space</span> Hold ~300 ms · release to start':state==='tap'?'<span class="keycap">Space</span> First action inspects · next hold arms':state==='running'?'<span class="keycap">Space</span> Stop only in timer focus':state==='inspect'||state==='armed'||state==='plus2'||state==='dnf'?'Arming counts as inspection · 15 s +2 · 17 s DNF':''}</p>${trainer==='oll'&&!isStopped()?`<div class="sample-case">${cube()}<span>Schematic · identity hidden</span></div>`:''}</div>`;
}
function syncURL(){const q=new URLSearchParams({variant,trainer,state});history.replaceState(null,'','?'+q);}
function render(){
 document.body.className=variant;document.getElementById('direction').innerHTML=`<span class="full-direction">${variant==='dock'?'A · session dock':'B · focus shelf'}</span><span class="mobile-direction">${variant==='dock'?'A · dock':'B · shelf'}<small>Sample preview</small></span>`;document.getElementById('state').value=state;
 document.getElementById('product').innerHTML=`<header class="toolbar"><span class="brand">Cube Trainer</span><label class="sr" for="trainer">Trainer</label><select id="trainer" ${['inspect','armed','plus2','dnf','running'].includes(state)?'disabled':''}><option value="cross" ${trainer==='cross'?'selected':''}>Cross</option><option value="cross1" ${trainer==='cross1'?'selected':''}>Cross+1</option><option value="oll" ${trainer==='oll'?'selected':''}>OLL drill</option></select><div class="summary">${button(config(),'settings')}</div><span class="spacer"></span><span class="health">Offline ready · sample</span><button class="tool" data-drawer="settings" aria-label="Settings">${icon('settings')}<span>Settings</span></button><button class="tool" data-drawer="help" aria-label="Help">${icon('help')}<span>Help</span></button><button class="mobile-session" data-drawer="session" aria-label="Open session">${icon('session')}</button></header><main class="workspace">${sessionDock()}<section class="stage" aria-label="${title()} practice workspace"><div class="rail"><div class="railmeta"><span>${trainer==='cross'?'Solve the cross only':trainer==='cross1'?'Cross + any pair':'Recognition · rep 3 of 10'}</span><span>White down · green front</span>${trainer==='oll'?'<span>Base: F2L solved, LL oriented</span>':''}</div><p class="scramble" aria-label="Illustrative scramble, not a verified challenge">${"R2 U F' L2 D B2 R' U2 F D' L U B' R2".split(' ').map(m=>`<span>${m}</span>`).join('')}</p></div>${timerFrame()}</section>${shelf()}</main>`;
 document.getElementById('trainer').addEventListener('change',e=>{trainer=e.target.value;closeDrawer(false);syncURL();render();});
}
function field(name,id,values){return `<div class="field"><label for="${id}">${name}</label><select id="${id}">${values.map(v=>`<option>${v}</option>`).join('')}</select></div>`;}
function drawerContent(name){
 if(name==='settings')return ['Practice settings',`${field('Cross color','color',['White','Yellow','Green','Blue','Red','Orange'])}${field('Maximum optimal cross depth K','depth',['At most 5 HTM','1','2','3','4','5','6','7','8'])}<p class="small">Maximum, not exact depth. Half turns count once.</p>${trainer==='cross1'?field('Combined solution cap L','cap',['Supported range pending measurement'])+field('Pair goal','pair',['Any pair','FR · front right','FL · front left','BR · back right','BL · back left'])+'<p class="small">A complete-goal witness within L. Not a global optimum. Witness slot stays hidden until review.</p>':''}${trainer==='oll'?field('Mode','mode',['Recognition','Execution'])+button('Choose cases / set','cases','outline'):''}${field('Inspection','inspection',['Untimed','15 seconds'])}<p class="small">Preparation includes scrambling and thinking. Its clock is hidden until results.</p><div class="actions">${button('Cancel','close')}${button('Apply to new challenge','next','primary')}</div><p class="small">Prototype controls only. Actual settings changes must discard the presented challenge explicitly; locked during inspection/execution/save-pending.</p>`];
 if(name==='help')return ['Practice guide',`<h3>${title()}</h3><p>${trainer==='cross'?'Time only your cross. K is a ceiling for the shortest cross, not exact depth.':trainer==='cross1'?'Stop when cross and a permitted pair are solved. Combined L is a found upper bound, not the shortest solution.':'Orient LL while preserving F2L. A successful rep may leave LL permutation unsolved. No PLL is required between OLL reps.'}</p><section><h3>Untimed</h3><p>Apply the scramble. Hold timer or Space about 300 ms, then release to start. Tap timer or press Space to stop.</p><h3>15 s inspection</h3><p>After scrambling, first tap/release starts inspection only. A subsequent hold arms execution. Arming counts as inspection. Release at 15,000 ms adds +2; at 17,000 ms records DNF. Warnings at elapsed 8 and 12 seconds.</p></section><p class="small">Only the timer region owns timing input. Space in controls/editor/player does not start or stop. Visibility loss interrupts; a cancelled hold disarms.</p>${button('Offline and backup','offline','outline')}`];
 if(name==='session')return ['Evening practice',`<p class="small">History sample eligibility · ${historyScope()}. This is the scope for past attempts, not current challenge settings. Current hidden case and witness are not shown.</p><div class="stats">${stat('Best successful','4.04')}${stat('Mean · 22 successful','4.76')}${stat('Median','4.62')}${stat('Population SD','0.58')}</div><p>24 attempts · 22 successful · 2 DNF</p>${log()}<div class="actions">${button('Execution','session','outline')}${button('Preparation*','preparation','outline')}${button('New / name session','notice')}</div><p class="small">DNF is not zero. ao5/ao12 trim best/worst once; remaining DNF means DNF. Whole runs and individual reps are separate.</p>`];
 if(name==='preparation')return ['Preparation results',`<p class="small">History sample eligibility · ${historyScope()}</p><p>Preparation includes scrambling, thinking and interruptions. Separate from execution and inspection.</p><div class="stats">${stat('Median · 24 samples','38.6 s')}${stat('Mean · 24 samples','39.7 s')}${stat('Population SD','5.4 s')}${stat('Range','29.8–52.1 s')}</div><p class="small">Illustrative preparation-only values. No execution best/mean/median/SD appear in this view. Preparation is not pure planning time.</p><div class="actions">${button('Execution results','session','outline')}</div>`];
 if(name==='attempt')return ['Attempt 24',`<h3>4.382 s · successful</h3><dl><dt>Raw execution</dt><dd>4.382 s</dd><dt>Penalty</dt><dd>None</dd><dt>Preparation · includes scrambling</dt><dd>38.600 s</dd><dt>Inspection</dt><dd>12.400 s</dd></dl><div class="actions">${button('No penalty','notice','outline')}${button('+2','notice','outline')}${button('DNF','notice','outline')}${button('Delete mistake','notice','danger')}${button('Undo latest edit','notice')}</div><p class="small">Explicit edit transactions in Build. Interrupted records cannot become successful via penalty edits. This preview changes nothing.</p>`];
 if(name==='review')return ['Attempt review',`<h3>${trainer==='cross'?'Optimal cross · proof-backed depth':trainer==='cross1'?'Found witness · upper bound':'Revealed case · sample A'}</h3><p class="small">${trainer==='cross1'?'Witness FR is illustrative generator metadata, not your observed pair. Optional executed slot is self-reported.':trainer==='oll'?'Representative case. Your unobserved LL permutation may differ.':'Color/frame and actual optimal depth come from the saved proof.'}</p><div class="player">${cube()}<p class="small">Schematic only · no playback engine</p></div><p style="font:18px Consolas,monospace">R U R' U' <span class="small">sample notation, not a verified solution</span></p><div class="actions">${button('Play / pause','notice','outline')}${button('Step back','notice')}${button('Step forward','notice')}${button('Replay','notice')}</div>${field('Speed','speed',['1×','0.5×'])}<p class="small">Orbit/zoom and player controls never time. Reduced motion disables autoplay; loading/error retains text notation.</p>${trainer==='oll'?button('Personal algorithm','algorithm','outline'):''}<section><h3>Timing</h3><dl><dt>Raw execution</dt><dd>4.382 s</dd><dt>Preparation · includes scrambling</dt><dd>38.600 s</dd><dt>Inspection</dt><dd>12.400 s</dd></dl></section>${trainer==='oll'?resetContent():''}`];
 if(name==='algorithm')return ['Personal algorithm',`<p>Sample A · revealed outside an active rep</p><label for="alg">Personal notation</label><textarea id="alg">R U R' U'</textarea>${field('Explicit pre-AUF','auf',['None','U','U2',"U'"])}<p class="warning">Illustrative text, not validated. Save is disabled.</p><p class="small">OLL must orient LL and preserve F2L across permitted permutations. LL permutation change is allowed. Invalid or wrong-case overrides retain current guidance.</p><div class="actions">${button('Validate','notice','outline')}<button disabled>Save override</button>${button('Use default','notice')}</div>`];
 if(name==='cases')return ['OLL case set',`<p>Separate OLL set. Full verified inventory target 57; this preview supplies no actual cases.</p>${['Sample A','Sample B','Sample C'].map((x,i)=>`<label class="checkrow"><input type="checkbox" ${i<2?'checked':''}>${x}</label>`).join('')}<p>2 selected · illustrative</p><p class="small">Select at least one. No mixed OLL/PLL set. Current hidden choice is never highlighted. A one-case pool limits recognition uncertainty.</p>${button('Apply to future run','notice','primary')}`];
 if(name==='next')return [trainer==='oll'?'Confirm the physical base':'New challenge',trainer==='oll'?resetContent():'<p>In the app this explicitly discards/replaces the current challenge and begins preparation only when a verified new scramble appears.</p><p class="small">Static preview. No new scramble is generated.</p>'];
 if(name==='unsaved')return ['Unsaved attempt',`<p class="error">Not saved. Keep this tab open.</p><p>Retry the same record or export it in the distinct unsaved-record format. No automatic advance. A normal backup does not include it.</p><div class="actions">${button('Retry save','notice','outline')}${button('Export unsaved record','notice')}</div>`];
 if(name==='offline')return ['Offline and local data',`<p>Readiness is verified for included trainers, not connection status alone.</p><section><h3>Required initial setup</h3><p>Shell, libraries, worker/tables and every player dependency, even never opened. Storage write/read/delete and cache-only checks must pass.</p><p class="small">Incomplete setup resumes missing work. Evicted assets downgrade readiness. Assets-ready/storage-failed is not durable practice ready.</p></section><p>Stored in this browser. Storage clearing or device loss can remove data. Keep a backup file.</p><div class="actions">${button('Export backup','notice','outline')}${button('Restore preview','restore','outline')}</div><p class="small">Updates wait during preparation, inspection, arming, execution or save-pending and for other active tabs. No automatic reload.</p>`];
 if(name==='restore')return ['Replace local data?',`<p>Sample file validated. Incoming: 1 setting, 3 sessions, 80 attempts, 4 algorithms, 2 sets and 5 runs.</p><p class="warning">Replaces all six personal record groups. No merge. Cancel keeps current data.</p><div class="actions">${button('Download current backup','notice','outline')}${button('Cancel','close')}${button('Replace local data','notice','danger')}</div><p class="small">Actual restore validates before mutation, rechecks current data, replaces atomically and rolls back on failure. Invalid/newer/incompatible files preserve existing data. Imported active runs recover interrupted, never resume a timer.</p>`];
 return ['Presentation only','<p>This control is shown for visual review. It makes no data changes.</p>'];
}
function resetContent(){return `<section><h3>Before the next OLL setup</h3><p>F2L solved and LL oriented. Permutation may remain unsolved. No PLL required.</p><div class="actions">${button('LL oriented, F2L solved','notice','primary')}${button('Failed / unsure: reset base','reset','outline')}</div><p class="small">Your physical confirmation, not automatic solve verification. PLL/ZBLL instead require fully solved and aligned, final AUF done.</p></section>`;}
function openDrawer(name,trigger){
 if(name==='close'){closeDrawer();return;}
 if(name==='review'&&!['result','long'].includes(state))return;
 if(name==='settings'&&['inspect','armed','plus2','dnf','running'].includes(state))name='locked';
 if(name==='next'&&state==='savefailed')return;
 if(!opener)opener=trigger;
 const [heading,body]=name==='reset'?['Reset OLL base',resetContent()]:name==='locked'?['Settings locked','<p>Finish or interrupt this attempt before changing options. The presented challenge stays fixed.</p>']:drawerContent(name);
 document.getElementById('product').inert=true;document.querySelector('.prototype').inert=true;
 document.getElementById('overlay').innerHTML=`<div class="backdrop" data-drawer="close"></div><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header><h2 id="drawer-title">${heading}</h2><button data-drawer="close" aria-label="Close drawer">${icon('close')}</button></header>${body}</section>`;
 document.querySelector('.drawer button').focus();
}
function closeDrawer(returnFocus=true){document.getElementById('overlay').innerHTML='';document.getElementById('product').inert=false;document.querySelector('.prototype').inert=false;if(returnFocus&&opener?.isConnected)opener.focus();opener=null;}
function cycle(){closeDrawer(false);variant=variant==='dock'?'focus':'dock';syncURL();render();}
document.getElementById('prev').addEventListener('click',cycle);document.getElementById('next').addEventListener('click',cycle);
document.getElementById('state').addEventListener('change',e=>{state=e.target.value;closeDrawer(false);syncURL();render();});
document.addEventListener('click',e=>{const target=e.target.closest('[data-drawer]');if(target)openDrawer(target.dataset.drawer,target);});
document.addEventListener('keydown',e=>{
 const drawer=document.querySelector('.drawer');
 if(drawer){if(e.key==='Escape'){e.preventDefault();closeDrawer();}if(e.key==='Tab'){const items=[...drawer.querySelectorAll('button:not(:disabled),select,input,textarea,a')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}
 if(e.repeat||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest('input,textarea,select,button,a,[contenteditable]'))return;
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle();}
 // No Space, pointer hold or document-wide timing handler in this visual prototype.
});
window.addEventListener('popstate',()=>{const q=new URLSearchParams(location.search);variant=q.get('variant')==='focus'?'focus':'dock';trainer=['cross','cross1','oll'].includes(q.get('trainer'))?q.get('trainer'):'cross';state=stateKeys.includes(q.get('state'))?q.get('state'):'ready';closeDrawer(false);render();});
render();
</script>
</body>
</html>
